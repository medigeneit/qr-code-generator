name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set site info from repository
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq --arg owner "${OWNER,,}" --arg repo "$REPOSITORY" \
            '.url = "https://\($owner).github.io" | .repo = "https://github.com/\($repo)"' \
            data/site.json > "$RUNNER_TEMP/site.json"
          mv "$RUNNER_TEMP/site.json" data/site.json
      - name: Build
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO" == *.github.io ]]; then BASE=/; else BASE="/$REPO/"; fi
          node alo build --base "$BASE"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
